<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>THE MAYFAIR SHOW — Check-In</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 15px;

      background: #eee9dd;

      color: #24201b;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }


    /* =========================
       PAGE
       ========================= */

    .page {
      width: 100%;
      max-width: 560px;
    }


    /* =========================
       MAIN CARD
       ========================= */

    .card {
      width: 100%;

      background: #fffdf9;

      border: 1px solid #bfb49f;

      border-radius: 5px;

      overflow: hidden;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.10);
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      text-align: center;

      padding:
        42px
        25px
        32px;

      border-bottom:
        1px solid #cfc6b3;
    }


    .title {
      margin: 0;

      font-size:
        clamp(
          30px,
          6.8vw,
          46px
        );

      line-height: .9;

      font-weight: 400;

      letter-spacing: -2px;

      color: #171515;

      white-space: nowrap;

      width: 100%;

      text-align: center;
    }


    .header-divider {
      width: 78%;

      height: 1px;

      margin:
        24px auto
        20px;

      background: #788047;

      position: relative;
    }


    .header-divider::after {
      content: "◇";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      background: #fffdf9;

      padding: 0 9px;

      color: #788047;

      font-size: 14px;
    }


    .curated {
      font-size: 17px;

      color: #788047;

      line-height: 1.3;

      margin-bottom: 12px;
    }


    .luxe {
      font-size: 27px;

      font-style: italic;

      color: #788047;

      letter-spacing: .7px;

      line-height: 1.1;
    }


    /* =========================
       CONTENT
       ========================= */

    .content {
      padding:
        38px
        35px
        35px;

      text-align: center;
    }


    .heading {
      margin: 0;

      font-size: 27px;

      font-weight: 400;

      letter-spacing: 3px;

      color: #66703a;
    }


    /* =========================
       ORNAMENT
       ========================= */

    .ornament {
      width: 170px;

      margin:
        14px auto
        20px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #788047;
    }


    .ornament::before,
    .ornament::after {
      content: "";

      height: 1px;

      background: #788047;

      flex: 1;
    }


    .ornament span {
      padding: 0 9px;

      font-size: 14px;
    }


    /* =========================
       CAMERA
       ========================= */

    .scanner-frame {
      width: 100%;

      padding: 8px;

      background: #f7f4ec;

      border:
        1px solid #d2c8b6;

      border-radius: 4px;
    }


    #video {
      width: 100%;

      display: block;

      background: #111;

      border-radius: 3px;
    }


    #canvas {
      display: none;
    }


    /* =========================
       STATUS
       ========================= */

    #status {
      margin-top: 18px;

      font-family: Arial, sans-serif;

      font-size: 13px;

      color: #77705f;

      line-height: 1.4;
    }


    /* =========================
       RESULT
       ========================= */

    #result {
      display: none;

      margin-top: 18px;

      padding: 22px;

      border-radius: 4px;

      font-family: Arial, sans-serif;
    }


    .success {
      background: #edf3e8;

      border:
        1px solid #b9c9a8;

      color: #40502f;
    }


    .already {
      background: #fff4df;

      border:
        1px solid #d8b76b;

      color: #795b18;
    }


    .error {
      background: #f8e9e9;

      border:
        1px solid #d6aaaa;

      color: #8b3030;
    }


    .name {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 26px;

      margin-bottom: 8px;
    }


    .id {
      font-size: 15px;

      font-weight: bold;

      letter-spacing: 2px;

      margin: 8px 0;
    }


    .message {
      margin-top: 12px;

      font-size: 16px;

      font-weight: bold;
    }


    .time {
      margin-top: 9px;

      font-size: 12px;

      opacity: .8;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {
      border-top:
        1px solid #cfc6b3;

      padding: 14px;

      text-align: center;

      font-size: 12px;

      letter-spacing: 2.5px;

      color: #788047;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 8px;

        align-items: flex-start;
      }


      .page {
        max-width: 560px;
      }


      .header {
        padding:
          30px
          12px
          25px;
      }


      .title {
        font-size: 30px;

        letter-spacing: -1.5px;

        white-space: nowrap;

        width: 100%;
      }


      .header-divider {
        width: 82%;

        margin:
          18px auto
          15px;
      }


      .curated {
        font-size: 13px;

        margin-bottom: 9px;
      }


      .luxe {
        font-size: 22px;
      }


      .content {
        padding:
          28px
          20px
          27px;
      }


      .heading {
        font-size: 22px;

        letter-spacing: 2px;
      }


      .ornament {
        margin:
          10px auto
          17px;
      }


      .scanner-frame {
        padding: 6px;
      }


      #status {
        font-size: 12px;
      }


      .footer {
        padding: 11px;

        font-size: 10px;
      }

    }

  </style>

</head>


<body>


<div class="page">


  <div class="card">


    <!-- HEADER -->

    <div class="header">

      <h1 class="title">
        THE MAYFAIR SHOW
      </h1>


      <div class="header-divider"></div>


      <div class="curated">
        Curated by Prakshi Gupta &amp; Raman Nagpal
      </div>


      <div class="luxe">
        LUXE EDIT - LE MILL
      </div>

    </div>


    <!-- CHECK-IN -->

    <div class="content">


      <h2 class="heading">
        VISITOR CHECK-IN
      </h2>


      <div class="ornament">

        <span>✦</span>

      </div>


      <!-- CAMERA -->

      <div class="scanner-frame">

        <video
          id="video"
          autoplay
          playsinline>
        </video>

      </div>


      <canvas id="canvas"></canvas>


      <div id="status">
        Starting camera...
      </div>


      <!-- RESULT -->

      <div id="result"></div>


    </div>


    <!-- FOOTER -->

    <div class="footer">
      THE MAYFAIR SHOW
    </div>


  </div>


</div>



<script>


/* =========================
   APPS SCRIPT URL
   ========================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzJXSgeFsAJmuvztxMf0qOKj6PRxBMoAsUrhHkJeBNxbJfVfnGPcnjAgbB9SH2Jd4Z-/exec";


/* =========================
   ELEMENTS
   ========================= */

const video =
  document.getElementById("video");

const canvas =
  document.getElementById("canvas");

const context =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");


let scanning = true;


/* =========================
   START CAMERA
   ========================= */

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    video.srcObject = stream;


    status.innerText =
      "Point the camera at the visitor's QR code.";


    requestAnimationFrame(scanQR);

  }

  catch(error) {

    console.error(error);

    status.innerText =
      "Camera permission is required.";

  }

}


/* =========================
   SCAN QR
   ========================= */

function scanQR() {

  if (!scanning) {
    return;
  }


  if (
    video.readyState ===
    video.HAVE_ENOUGH_DATA
  ) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code) {

      scanning = false;


      status.innerText =
        "QR detected — verifying visitor...";


      checkIn(code.data);

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


/* =========================
   CHECK IN
   ========================= */

async function checkIn(visitorID) {

  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL +
        "?checkin=" +
        encodeURIComponent(visitorID)
      );


    const data =
      await response.json();


    showResult(data);

  }

  catch(error) {

    console.error(error);


    showResult({

      success: false,

      alreadyCheckedIn: false,

      message: "SYSTEM ERROR",

      id: visitorID

    });

  }

}


/* =========================
   SHOW RESULT
   ========================= */

function showResult(data) {

  result.style.display = "block";


  /* =========================
     SUCCESS
     ========================= */

  if (data.success) {

    result.className = "success";


    result.innerHTML = `

      <div class="name">
        ${data.name}
      </div>

      <div class="id">
        ${data.id}
      </div>

      <div class="message">
        ✓ CHECK-IN SUCCESSFUL
      </div>

    `;


    status.innerText =
      "Visitor successfully checked in.";


    return;
  }


  /* =========================
     ALREADY CHECKED IN
     ========================= */

  if (data.alreadyCheckedIn) {

    result.className = "already";


    result.innerHTML = `

      <div class="name">
        ${data.name}
      </div>

      <div class="id">
        ${data.id}
      </div>

      <div class="message">
        ⚠ VISITOR ALREADY CHECKED IN
      </div>

      <div class="time">
        This entry pass has already been used.
      </div>

    `;


    status.innerText =
      "Duplicate entry detected.";


    return;
  }


  /* =========================
     INVALID
     ========================= */

  result.className = "error";


  result.innerHTML = `

    <div class="name">
      ${data.message}
    </div>

    <div class="id">
      ${data.id || ""}
    </div>

  `;


  status.innerText =
    "Please check the visitor's entry pass.";

}


startCamera();

</script>


</body>
</html>
