<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>The May Fair Show — Check-In</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      font-family: Georgia, "Times New Roman", serif;

      background:
        linear-gradient(
          135deg,
          #f5f1e8,
          #e9e4d6
        );

      color: #24201b;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 520px;

      background: #ffffff;

      border: 1px solid #d8d0bd;

      box-shadow:
        0 12px 40px rgba(0,0,0,0.12);

      border-radius: 6px;

      overflow: hidden;
    }


    /* HEADER */

    .header {
      text-align: center;

      padding: 28px 20px 18px;

      border-bottom: 1px solid #d8d0bd;
    }

    .title {
      font-size: clamp(34px, 9vw, 58px);

      line-height: 0.95;

      font-weight: 500;

      letter-spacing: -2px;

      margin: 0;
    }

    .curated {
      margin-top: 20px;

      font-size: 18px;

      color: #788047;

      letter-spacing: 0.5px;
    }

    .year {
      margin-top: 8px;

      font-family: Arial, sans-serif;

      font-size: 14px;

      letter-spacing: 4px;

      color: #77705f;
    }


    /* CHECK-IN AREA */

    .checkin {
      padding: 25px 25px 30px;

      text-align: center;
    }

    .heading {
      font-family: Arial, sans-serif;

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 1px;

      margin-bottom: 18px;
    }


    #video {
      width: 100%;

      display: block;

      background: #111;

      border-radius: 8px;

      border: 4px solid #e2dccd;
    }


    #canvas {
      display: none;
    }


    #status {
      margin-top: 18px;

      font-family: Arial, sans-serif;

      font-size: 15px;

      color: #666;
    }


    /* RESULT */

    #result {
      display: none;

      margin-top: 20px;

      padding: 24px;

      border-radius: 8px;

      font-family: Arial, sans-serif;
    }


    .success {
      background: #edf3e8;

      border: 1px solid #b9c9a8;

      color: #40502f;
    }


    .already {
      background: #fff4df;

      border: 1px solid #d8b76b;

      color: #795b18;
    }


    .error {
      background: #f8e9e9;

      border: 1px solid #d6aaaa;

      color: #8b3030;
    }


    .name {
      font-size: 27px;

      font-weight: bold;

      margin-bottom: 8px;
    }


    .id {
      font-size: 17px;

      font-weight: bold;

      letter-spacing: 2px;

      margin: 8px 0;
    }


    .message {
      font-size: 18px;

      font-weight: bold;

      margin-top: 12px;
    }


    .time {
      margin-top: 10px;

      font-size: 14px;

      opacity: 0.8;
    }


    /* FOOTER */

    .footer {
      text-align: center;

      padding: 15px;

      border-top: 1px solid #d8d0bd;

      font-family: Arial, sans-serif;

      font-size: 12px;

      color: #77705f;

      letter-spacing: 1px;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1 class="title">
      THE MAYFAIR SHOW
    </h1>

    <div class="curated">
      Curated by Prakshi Gupta &amp; Raman Nagpal
    </div>

    <div class="year">
       LUXE EDIT - LE MILL
    </div>

  </div>


  <div class="checkin">

    <div class="heading">
      VISITOR CHECK-IN
    </div>


    <video id="video"
           autoplay
           playsinline>
    </video>


    <canvas id="canvas"></canvas>


    <div id="status">
      Starting camera...
    </div>


    <div id="result"></div>

  </div>


  <div class="footer">
    PLEASE PRESENT YOUR ENTRY PASS
  </div>


</div>


<script>


const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzJXSgeFsAJmuvztxMf0qOKj6PRxBMoAsUrhHkJeBNxbJfVfnGPcnjAgbB9SH2Jd4Z-/exec";


const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const context =
canvas.getContext("2d");

const status =
document.getElementById("status");

const result =
document.getElementById("result");


let scanning = true;


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;


    status.innerText =
      "Point the camera at the visitor's QR code.";


    requestAnimationFrame(scanQR);

  }

  catch(error) {

    status.innerText =
      "Camera permission is required.";

    console.error(error);

  }

}


function scanQR() {

  if (!scanning) {
    return;
  }


  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code) {

      scanning = false;

      status.innerText =
        "QR detected — verifying visitor...";


      checkIn(code.data);

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


async function checkIn(visitorID) {

  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL +
        "?checkin=" +
        encodeURIComponent(visitorID)
      );


    const data =
      await response.json();


    showResult(data);

  }

  catch(error) {

    console.error(error);

    showResult({

      success: false,

      message:
        "SYSTEM ERROR",

      id:
        visitorID

    });

  }

}


function showResult(data) {

  result.style.display =
    "block";


  /* SUCCESS */

  if (data.success) {

    result.className =
      "success";


    result.innerHTML = `

      <div class="name">
        ${data.name}
      </div>

      <div class="id">
        ${data.id}
      </div>

      <div>
        ${data.phone}
      </div>

      <div class="message">
        ✓ CHECK-IN SUCCESSFUL
      </div>

    `;


    status.innerText =
      "Visitor successfully checked in.";

    return;

  }


  /* ALREADY CHECKED IN */

  if (data.alreadyCheckedIn) {

    result.className =
      "already";


    result.innerHTML = `

      <div class="name">
        ${data.name}
      </div>

      <div class="id">
        ${data.id}
      </div>

      <div class="message">
        ⚠ VISITOR ALREADY CHECKED IN
      </div>

      <div class="time">
        This pass has already been used.
      </div>

    `;


    status.innerText =
      "Duplicate entry detected.";

    return;

  }


  /* INVALID */

  result.className =
    "error";


  result.innerHTML = `

    <div class="name">
      ${data.message}
    </div>

    <div class="id">
      ${data.id || ""}
    </div>

  `;


  status.innerText =
    "Please check the visitor's entry pass.";

}


startCamera();


</script>


</body>
</html>
