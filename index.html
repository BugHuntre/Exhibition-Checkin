<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Exhibition Check-In</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    #canvas {
      display: none;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      display: none;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #c62828;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
    }

    .id {
      font-weight: bold;
      margin: 10px 0;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>EXHIBITION 2026</h1>

  <div class="subtitle">
    Visitor Check-In
  </div>

  <video id="video"
         autoplay
         playsinline>
  </video>

  <canvas id="canvas"></canvas>

  <div id="status">
    Starting camera...
  </div>

  <div id="result"></div>

</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzJXSgeFsAJmuvztxMf0qOKj6PRxBMoAsUrhHkJeBNxbJfVfnGPcnjAgbB9SH2Jd4Z-/exec";


const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const context =
canvas.getContext("2d");


const status =
document.getElementById("status");


const result =
document.getElementById("result");


let scanning = true;


async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    video.srcObject = stream;

    status.innerText =
      "Point the camera at the visitor QR code.";

    requestAnimationFrame(scanQR);

  }

  catch(error) {

    status.innerText =
      "Camera permission denied.";

    console.error(error);

  }

}


function scanQR() {

  if (!scanning) {
    return;
  }


  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    context.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imageData =
      context.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const code =
      jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        {
          inversionAttempts:
            "attemptBoth"
        }
      );


    if (code) {

      console.log(
        "QR DETECTED:",
        code.data
      );


      scanning = false;

      status.innerText =
        "QR detected! Checking visitor...";

      checkIn(code.data);

      return;

    }

  }


  requestAnimationFrame(scanQR);

}


async function checkIn(visitorID) {

  try {

    const response =
      await fetch(
        APPS_SCRIPT_URL +
        "?checkin=" +
        encodeURIComponent(visitorID)
      );


    const data =
      await response.json();


    showResult(data);

  }

  catch(error) {

    console.error(error);

    showResult({

      success: false,

      message:
        "SYSTEM ERROR",

      id:
        visitorID

    });

  }

}


function showResult(data) {

  result.style.display =
    "block";


  if (data.success) {

    result.className =
      "success";


    result.innerHTML = `

      <div class="name">
        ${data.name}
      </div>

      <div class="id">
        ${data.id}
      </div>

      <div>
        ${data.phone}
      </div>

      <br>

      <strong>
        CHECK-IN SUCCESSFUL
      </strong>

    `;


    status.innerText =
      "Visitor checked in successfully.";

  }

  else {

    result.className =
      "error";


    result.innerHTML = `

      <div class="name">
        ${data.message}
      </div>

      <div class="id">
        ${data.id || ""}
      </div>

    `;


    status.innerText =
      "Scan another QR code.";

  }

}


startCamera();

</script>

</body>
</html>
